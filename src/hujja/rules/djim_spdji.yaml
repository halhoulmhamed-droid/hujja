open_decisions:
  - id: od_evaluation_period_duration
    question: "Duration and scheduling of an evaluation period."
    resolution_paths: ["obtain_authoritative_definition"]
    status: open
    decided_on: null

  - id: od_evaluation_review_mapping
    question: "Whether one evaluation period maps to one quarterly index review."
    resolution_paths: ["obtain_authoritative_definition"]
    status: open
    decided_on: null

  - id: od_sampling_interval
    question: "Observation interval used to construct the trailing 24-month average."
    resolution_paths:
      - "obtain_authoritative_definition"
      - "make_and_disclose_a_separately_reviewed_implementation_decision"
    status: open
    decided_on: null

  - id: od_missing_input_policy
    question: "Engine behaviour when a required input is absent from the fact snapshot."
    resolution_paths: ["engine_layer_design_decision"]
    status: open
    decided_on: null

  - id: od_classification_delivery_channel
    question: "Delivery channel through which external classification assignments reach the engine."
    resolution_paths: ["project_interface_design_decision"]
    status: open
    decided_on: null

  - id: od_adapter_assignment_shape
    question: "Adapter-contract shape for externally supplied classification assignments."
    resolution_paths: ["adapter_contract_design_decision"]
    status: open
    decided_on: null

  - id: od_conditional_eligibility_clauses
    question: >-
      Page-referenced conditions of the external-classification eligibility
      test, and which excluded activity it qualifies.
    resolution_paths: ["obtain_page_referenced_extraction"]
    status: open
    decided_on: null

required_inputs:
