  reviewer: null
  scope: null
  date: null

source_evidence:
  - id: se_2026_appendix_a_ratio
    edition_ref: ed_2026_02
    locator: "Appendix A, PDF 33 / printed 32"
    scope: >-
      Active accounting-based ratio screen, its ordinary threshold and
      comparator, the transition band, both transition directions, the trailing
      average denominator, and the dependence on an external classification.
    verification_log_ref: "README.md#source-verification-log"

  - id: se_2026_appendix_a_sectors
    edition_ref: ed_2026_02
    locator: "Appendix A, PDF 32 / printed 31"
    scope: >-
      Excluded business-activity categories in this edition, the weapons
      deployment-purpose qualifier, the pork-selling nexus, the split of the
      earlier entertainment category, and the revenue-tolerance denominator
      label.
    verification_log_ref: "README.md#source-verification-log"

  - id: se_2026_appendix_e_change
    edition_ref: ed_2026_02
    locator: "Appendix E, PDF 40-41 / printed 39-40"
    scope: >-
      Methodology-change record replacing the former immediate re-entry route
      with a three-consecutive-period return requirement.
    verification_log_ref: "README.md#source-verification-log"

  - id: se_2026_index_maintenance
    edition_ref: ed_2026_02
    locator: "Index Maintenance -- Broad-Market Indices, PDF 23 / printed 22"
    scope: >-
      Quarterly broad-market index composition review schedule. An index-review
      schedule only, not a definition of a transition evaluation period.
    verification_log_ref: "README.md#source-verification-log"

  - id: se_2023_appendix_i_sectors
    edition_ref: ed_2023_12
    locator: "Appendix I, PDF 30 / printed 29"
    scope: >-
      Excluded business-activity categories in the earlier edition, the earlier
      entertainment category, the earlier revenue-tolerance denominator label,
      and an external classification code reference.
    verification_log_ref: "README.md#source-verification-log"

  - id: se_2023_appendix_i_ratio
    edition_ref: ed_2023_12
    locator: "Appendix I, PDF 31 / printed 30"
    scope: >-
      Trailing average market-capitalization denominator and a further external
      classification code reference in the earlier edition.
    verification_log_ref: "README.md#source-verification-log"

  - id: se_2023_appendix_v_change
    edition_ref: ed_2023_12
    locator: "Appendix V, PDF 38-39 / printed 37-38"
    scope: >-
      Earlier-edition record of the same change entry replacing the immediate
      re-entry route.
    verification_log_ref: "README.md#source-verification-log"

