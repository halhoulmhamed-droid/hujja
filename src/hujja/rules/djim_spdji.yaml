    threshold: 0.33
    threshold_provenance_ref: pv_leverage_threshold
    active_ratio_count_provenance_ref: pv_active_ratio_count
    contextual_claims:
      - id: ctx_accounts_receivable_screen_removed
        summary: >-
          An accounts-receivable screen was removed in March 2023.
        provenance_ref: pv_ctx_accounts_receivable_removal_inherited
      - id: ctx_cash_securities_screen_removed
        summary: >-
          A cash-plus-interest-bearing-securities screen was removed in
          September 2023.
        provenance_ref: pv_ctx_cash_securities_removal_inherited
