# Hujja rule file -- Dow Jones Islamic Market Index (S&P Dow Jones Indices).
#
# Documentary resolution below is stated against the DECLARED REVIEWED EVIDENCE
# SET for this rule file: the official methodology editions and locators listed
# under `source_evidence`. Where a claim carries no locator, that means this
# evidence set does not establish it -- not that every possible source is silent.
#
# Nothing here is a fatwa or investment advice. Consult a qualified scholar.

schema_version: "2.0.0"

rule_file:
  id: djim_spdji
  version: "1.1.0"

standard:
  id: DJIM_SPDJI
  name: "Dow Jones Islamic Market Index"
  provider: "S&P Dow Jones Indices"
  family: "Dow Jones Islamic Market"
  series: "Broad Market"

methodology:
