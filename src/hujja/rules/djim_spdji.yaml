      open_decision_ref: od_missing_input_policy
    provenance_ref: pv_leverage_numerator_inherited

  - id: in_market_capitalization
    kind: entity_market_observation
    description: >-
      Market capitalization observations. Not derivable from issuer filings,
      which carry share counts but no prices.
    data_origin:
      semantic_source: market_observation
      supplied_via: caller
    absence:
