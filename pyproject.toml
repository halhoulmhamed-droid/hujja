[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hujja"
version = "0.0.1"
description = "Open-source rules-as-code Shariah stock screening engine — auditable rules, one verdict per standard"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Mhamed Halhoul", email = "contact@hujja.dev" },
]
keywords = [
    "shariah",
    "islamic-finance",
    "halal",
    "screening",
    "compliance",
    "aaoifi",
    "rules-as-code",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://hujja.dev"
Documentation = "https://hujja.dev"
Source = "https://github.com/halhoulmhamed-droid/hujja"
Issues = "https://github.com/halhoulmhamed-droid/hujja/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hujja = ["rules/*.yaml", "schemas/*.json"]
